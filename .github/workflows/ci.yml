# CI: сборка и проверка Gradle-плагина на каждый push/PR.
#
# `:plugin:build` включает компиляцию, `validatePlugins` (проверка метаданных
# plugin descriptor'а) и тесты.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew :plugin:build --stacktrace
