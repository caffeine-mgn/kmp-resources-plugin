# Публикация Gradle-плагина по тегу N.N.N (или N.N.N-suffix).
#
#   Maven Central — основной канал: артефакт pw.binom:kmp-resources-plugin и
#   marker pw.binom.resources:pw.binom.resources.gradle.plugin. Подключение:
#       plugins { id("pw.binom.resources") version "1.4.1" }
#   резолвится из mavenCentral(), если он есть в pluginManagement.repositories
#   (в новых проектах он там по умолчанию).
#
#   Gradle Plugin Portal — включается, если в репозитории заведены секреты
#   GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET (креды с plugins.gradle.org).
#   Без них шаг пропускается, релиз в Central всё равно проходит.

name: Release to Maven Central & Gradle Plugin Portal

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для публикации (по умолчанию — имя тега/ветки)'
        required: false
        default: ''
      portal_only:
        description: 'Публиковать только в Gradle Plugin Portal (повторная отправка)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Значения приходят из секретов репозитория; если секрета нет — пустая
      # строка, и шаг публикации в Plugin Portal пропускается.
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      # При ручном запуске версию можно задать явно, иначе — имя тега/ветки.
      PUBLISH_VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check plugin metadata
        run: ./gradlew :plugin:validatePlugins --stacktrace

      # GPG-ключ импортируется в системный keyring; подпись Gradle делает через
      # бинарь gpg (useGpgCmd). ~/.gnupg на свежем раннере ещё нет — создаём.
      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%b' "$GPG_KEY" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --import
          else
            printf '%b' "$GPG_KEY" | gpg --batch --yes --pinentry-mode loopback --import
          fi
          gpg --list-secret-keys --with-colons | grep -q '^sec' && echo "GPG key imported"

      - name: Publish to Maven Central
        if: github.event.inputs.portal_only != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew :plugin:publishToMavenCentral \
            -Pversion="$PUBLISH_VERSION" \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername=${{ secrets.CENTRAL_USERNAME }} \
            -PmavenCentralPassword=${{ secrets.CENTRAL_PASSWORD }}

      - name: Publish to Gradle Plugin Portal
        if: env.GRADLE_PUBLISH_KEY != ''
        run: |
          ./gradlew :plugin:publishPlugins \
            -Pversion="$PUBLISH_VERSION" \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="${{ secrets.GPG_KEY_ID }}" \
            -Psigning.gnupg.passphrase="${{ secrets.GPG_PASSWORD }}"
